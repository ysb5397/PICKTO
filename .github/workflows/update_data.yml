name: Auto Update Lottery Data

on:
  schedule:
    # 국내 시간 일요일 00:00 실행 (UTC 기준 토요일 15:00)
    - cron: '0 15 * * 6'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        # 크롤링을 위한 beautifulsoup4 추가
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Lotto 6/45 update script
        run: python update_lotto.py

      - name: Run Pension 720+ update script
        run: python update_pension.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lotto645.csv data/pension720.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update lottery data" && git push)