name: Auto Update Lotto Data

on:
  schedule:
    # 한국 시간 기준 매주 토요일 오후 9시 30분 실행 (UTC 기준 12:30)
    - cron: '30 12 * * 6'
  workflow_dispatch: # 수동으로 버튼을 눌러서 실행할 수 있게 해주는 옵션

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        run: python update_lotto.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lotto.csv
          # 변경사항이 있을 때만 커밋하고 푸시
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update lotto data" && git push)